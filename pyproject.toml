[project]
name = "network-backbone-explorer"
version = "1.0.0"
description = "Interactive dashboard for network backbone extraction and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ── Existing research dependencies ──────────────────────────────
    "networkx>=3.4.2",
    "pandas>=2.2.3",
    "numpy>=1.26",
    "scikit-learn>=1.6.1",
    "scipy>=1.13",
    "joblib>=1.4.2",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    # ── New web application dependencies ────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv]
dev-dependencies = ["ipykernel>=6.29.5"]
